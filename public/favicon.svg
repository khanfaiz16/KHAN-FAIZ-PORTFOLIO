<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" fill="#07090e" />
  <rect x="2" y="2" width="96" height="96" rx="24" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.8" />
  <text x="50" y="66" font-family="'Poppins', 'Inter', sans-serif" font-size="44" font-weight="900" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">KF</text>
</svg>
